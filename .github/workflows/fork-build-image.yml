name: Fork - Build Embedded Image

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        required: true
        type: string
      image_tags:
        description: 'Newline-separated list of full image tags to push'
        required: true
        type: string
      app_version:
        description: 'Value for the APP_VERSION build arg'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: true
        type: string
        default: embedded-database
      image_tags:
        description: 'Newline-separated list of full image tags to push'
        required: true
        type: string
        default: ghcr.io/benjitobz/grimmory:develop
      app_version:
        description: 'Value for the APP_VERSION build arg'
        required: true
        type: string
        default: manual

concurrency:
  group: fork-build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Record Build Metadata
        id: meta
        run: |
          set -eu
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image_tags }}
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
            APP_REVISION=${{ steps.meta.outputs.revision }}
          cache-from: type=gha,scope=fork-embedded
          cache-to: type=gha,scope=fork-embedded,mode=max

      - name: Summarise
        run: |
          {
            echo "### Built \`${{ inputs.ref }}\`"
            echo
            echo "Version: \`${{ inputs.app_version }}\`"
            echo "Revision: \`${{ steps.meta.outputs.revision }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ inputs.image_tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
